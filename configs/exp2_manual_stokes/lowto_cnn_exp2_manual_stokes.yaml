# =============================================================================
# LOWTO SimpleCNN — Experiment 2: Manual Stokes Input
# =============================================================================
# Input: [I, DoLP, sin(AoP), cos(AoP)] derived analytically from raw pixels.
# Identical training protocol to MLP Exp 2 — only model block changes.
# Direct comparison isolates architectural effect (spatial vs. flatten).
# =============================================================================

experiment:
  name: "lowto_cnn_exp2_manual_stokes"
  description: >
    12-fold LOWTO for SimpleCNN with manual Stokes input
    [I, DoLP, sin(AoP), cos(AoP)]. Four conv blocks (32, 64, 128, 128)
    with BN + ReLU + MaxPool, adaptive average pooling, regression head
    (128->64->1). All training hyperparameters identical to MLP Exp 2
    to isolate the effect of architecture (spatial vs. flatten).
  seed: 0

device: "auto"

data:
  dataset_root: "../../dataset"
  splits_csv:   "../../dataset/splits.csv"
  image_size:   224
  channels: ["I", "DoLP", "sin_AoP", "cos_AoP"]
  normalization: "zscore_train_only"

split:
  mode: "lowto"
  fold_column: "fold_lowto"
  val_rule: "cyclic_next"
  n_folds: 12

model:
  name: "simple_cnn"          # changed from shallow_mlp
  params:
    in_channels: 4

training:
  loss: "mse"
  batch_size: 16              # CNN uses 16 (GPU memory), MLP used 32

  optimizer:
    name: "adamw"
    lr: 1.0e-4
    weight_decay: 1.0e-4
    betas: [0.9, 0.999]
    eps: 1.0e-8

  scheduler:
    name: "reduce_lr_on_plateau"
    mode: "min"
    factor: 0.5
    patience: 5
    threshold: 1.0e-4
    threshold_mode: "rel"
    min_lr: 1.0e-7

  early_stopping:
    patience: 10
    delta: 1.0e-4
    mode: "min"

  min_epochs: 20
  max_epochs: 60
  grad_clip_norm: 1.0
  num_workers: 4
  pin_memory: true

evaluation:
  metrics: ["rmse", "mae", "mse", "bias", "mape", "r2"]
  pool_predictions_for_r2: true

output:
  runs_root: "outputs/runs"
  timestamp_format: "%Y%m%d_%H%M%S"
  save_per_fold:
    config_snapshot: true
    channel_stats:   true
    training_history: true
    predictions_csv:  true
    best_checkpoint:  true
    fold_summary:     true
  save_aggregate:
    pooled_predictions: true
    summary_metrics:    true
    per_wavetrain_table: true