# =============================================================================
# LOWTO ShallowMLP — Experiment 2: Manual Stokes Input
# =============================================================================
# Input: [I, DoLP, sin(AoP), cos(AoP)] derived analytically from raw pixels.
# Identical training protocol to lowto_mlp_v1 (Exp 1, raw input).
# Direct comparison isolates the effect of input representation only.
# =============================================================================

experiment:
  name: "lowto_mlp_exp2_manual_stokes"
  description: >
    12-fold LOWTO for ShallowMLP with manual Stokes input
    [I, DoLP, sin(AoP), cos(AoP)]. Derived from raw polarimetric channels
    at full resolution before resize. All training hyperparameters are
    identical to Exp 1 (raw input) to isolate the effect of input
    representation on SWH estimation accuracy.
  seed: 0

device: "auto"

data:
  dataset_root: "../../dataset"
  splits_csv:   "../../dataset/splits.csv"
  image_size:   224
  channels: ["I", "DoLP", "sin_AoP", "cos_AoP"]   # changed from Exp 1
  normalization: "zscore_train_only"

split:
  mode: "lowto"
  fold_column: "fold_lowto"
  val_rule: "cyclic_next"
  n_folds: 12

model:
  name: "shallow_mlp"
  params:
    in_channels: 4       # unchanged — still 4 channels
    image_size:  224
    hidden1:     512
    hidden2:     128
    dropout:     0.3

training:
  loss: "mse"
  batch_size: 32

  optimizer:
    name: "adamw"
    lr: 1.0e-4
    weight_decay: 1.0e-4
    betas: [0.9, 0.999]
    eps: 1.0e-8

  scheduler:
    name: "reduce_lr_on_plateau"
    mode: "min"
    factor: 0.5
    patience: 5
    threshold: 1.0e-4
    threshold_mode: "rel"
    min_lr: 1.0e-7

  early_stopping:
    patience: 10
    delta: 1.0e-4
    mode: "min"

  min_epochs: 20
  max_epochs: 60
  grad_clip_norm: 1.0
  num_workers: 4
  pin_memory: true

evaluation:
  metrics: ["rmse", "mae", "mse", "bias", "mape", "r2"]
  pool_predictions_for_r2: true

output:
  runs_root: "outputs/runs"
  timestamp_format: "%Y%m%d_%H%M%S"
  save_per_fold:
    config_snapshot: true
    channel_stats:   true
    training_history: true
    predictions_csv:  true
    best_checkpoint:  true
    fold_summary:     true
  save_aggregate:
    pooled_predictions: true
    summary_metrics:    true
    per_wavetrain_table: true